name: Build Portal Gun

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q project.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build mod
        run: |
          cd portalgun121
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: portal-gun-mod
          path: portalgun121/build/libs/*.jar
